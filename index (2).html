  if(!v&&k&&(m=k.match(/^(\S+) (.+)$/))&&M[m[2]])v=m[1]+" "+M[m[2]];
  n.nodeValue=v?o.replace(k,()=>v):o}
 r.querySelectorAll("[placeholder],[aria-label]").forEach(e=>["placeholder","aria-label"].forEach(a=>{if(e.hasAttribute(a)){const o=e["_"+a]??=e.getAttribute(a);e.setAttribute(a,M[o]||o)}}))}
const txa=()=>["nav","footer","#app","#dlg"].forEach(q=>tx($(q)));
const NB=`<p class=warn>Codes stay Unverified until they are tested in the retail game (launch: November 19, 2026).</p>`;
const LT=new Date(2026,10,19);
function tick(){const w=$("#cdw");if(!w)return;const d=LT-Date.now();
 if(d<=0){w.innerHTML=`<b class=out>${tr("Out now — November 19, 2026")}</b>`;$("#cdl").style.display="none";return}
 const s=d/1e3|0;[s/86400|0,s%86400/3600|0,s%3600/60|0,s%60].forEach((v,i)=>{const e=$("#c"+i);if(e)e.textContent=String(v).padStart(2,"0")})}
setInterval(tick,1000);
/* ---------- data ---------- */
function sub(){
 unsub.forEach(f=>f());unsub=[];
 const q=n=>ADM?collection(db,n):query(collection(db,n),where("published","==",true));
 const on=(k,r)=>unsub.push(onSnapshot(r,s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(k,e.message)));
 on("cheats",q("cheats"));on("posts",q("posts"));on("categories",collection(db,"categories"));
 unsub.push(onSnapshot(doc(db,"settings","site"),s=>{D.site=s.data()||{};if(ADM&&!D.site.seeded)seed();render()},e=>console.warn(e.message)));
 if(ADM)on("messages",collection(db,"messages"));
}

/* ---------- public pages ---------- */
const R={};
R.home=()=>{const s=D.site,c=P("cheats");return`<header class=hero><img class=vi src="vi-logo.webp" alt="GTA VI"><br><span class="b p">Independent fan-made tracker</span><h1>${h(s.heroTitle||"All GTA VI cheat codes")}</h1><p class=mu style="max-width:620px;margin:0 auto 26px">${h(s.heroSub||"Search every entry, filter by platform and see exactly what is verified and what is not.")}</p><form id=hf class=sb><input name=q placeholder="Search cheats, vehicles, weapons…" aria-label=Search><button class=btn>Search</button></form><p class=cdl id=cdl>GTA VI launches in</p><div id=cdw class=cd>${["Days","Hours","Min","Sec"].map((x,i)=>`<div><b id=c${i}>00</b>${x}</div>`).join("")}</div><p style="margin-top:22px"><a class=btn href="#/cheats">Browse all cheats</a> <a class="btn o" href="#/guides">Guides</a></p><div class=st><div><b>${c.length}</b>Cheats</div><div><b>${c.filter(ver).length}</b>Verified</div><div><b>${cats().length}</b>Categories</div><div><b>${P("posts").filter(p=>p.type==="guide").length}</b>Guides</div></div></header>
<div class=pg style="padding-bottom:0">${NB}</div><section><h2>Browse by category</h2><div class=grid>${cats().map(([n,i])=>`<a class=card href="#/cheats" data-a=cat data-c="${h(n)}"><span class=ic>${h(i)}</span><h3>${h(n)}</h3><p class=mu><span>${c.filter(x=>x.category===n).length}</span> entries</p></a>`).join("")}</div></section>
<section><div class=row style="border:0"><h2 style="flex:1;margin:0">Latest cheats</h2><a class=l href="#/cheats">View all →</a></div>${gl(c.slice(0,6),card,"No cheats published yet.")}</section>
<section><div class=row style="border:0"><h2 style="flex:1;margin:0">Latest updates</h2><a class=l href="#/updates">View all →</a></div>${gl(P("posts").filter(p=>p.type==="update").slice(0,3),post,"No updates yet.")}</section>`};
R.cheats=()=>{const q=F.q.toLowerCase(),l=P("cheats").filter(c=>(!F.p||(c.platforms||[]).includes(F.p))&&(!F.c||c.category===F.c)&&(!q||[c.title,c.desc,c.code,c.category].join(" ").toLowerCase().includes(q)));
return`<div class=pg><h2>Cheat database</h2>${NB}<p class=mu><span>${l.length}</span> / <span>${P("cheats").length}</span> entries</p><input id=q placeholder="Live search…" value="${h(F.q)}" style="margin:16px 0" aria-label="Live search"><div class=chips>${[["","All platforms"],...Object.entries(PL)].map(([k,v])=>`<button class="chip ${F.p===k?"on":""}" data-a=plat data-k="${k}">${v}</button>`).join("")}</div><div class=chips>${[["","All categories"],...cats().map(c=>[c[0],c[1]+" "+c[0]])].map(([k,v])=>`<button class="chip ${F.c===k?"on":""}" data-a=fc data-k="${h(k)}">${h(v)}</button>`).join("")}</div>${gl(l,card,"No cheats match. Entries appear here once they are published.")}</div>`};
const plist=(t,n)=>`<div class=pg><h2>${n}</h2>${gl(P("posts").filter(p=>p.type===t),post,"Nothing published yet.")}</div>`;
R.updates=()=>plist("update","Latest updates");R.guides=()=>plist("guide","Guides & tutorials");
R.faq=()=>{const l=P("posts").filter(p=>p.type==="faq").map(p=>[p.title,p.body]);return`<div class=pg><h2>FAQ</h2>${(l.length?l:FQ).map(([q,a])=>`<details><summary>${h(q)}</summary><p class="mu wr">${h(a)}</p></details>`).join("")}</div>`};
R.contact=()=>`<div class=pg style="max-width:640px"><h2>Contact</h2><p class=mu>Found a mistake or a confirmed code? Send it over.</p><form id=cf><label>Name<input name=name required maxlength=80></label><label>Email<input name=email type=email required maxlength=120></label><label>Message<textarea name=message rows=5 required maxlength=1500></textarea></label><p style="margin-top:14px"><button class=btn>Send message</button></p><p id=cm class=mu></p></form></div>`;
/* ---------- admin ---------- */
const row=(k,x)=>k==="messages"?`<div class=row><div style="flex:1"><b>${h(x.name)}</b> <span class=mu>${h(x.email)}</span><p class=wr>${h(x.message)}</p></div><button class="btn o" data-a=del data-k=messages data-id="${x.id}">Delete</button></div>`:`<div class=row><b>${h(x.title||x.name)}</b>${x.type?`<span class="b p">${h(x.type)}</span>`:""}${x.status?bd(x):""}${x.published===false?`<span class="b u">Draft</span>`:""}<button class="btn o" data-a=ed data-k=${k} data-id="${x.id}">Edit</button><button class="btn o" data-a=del data-k=${k} data-id="${x.id}">Delete</button></div>`;
R.admin=()=>{
 if(!U)return`<div class=pg style="max-width:420px"><h2>Admin login</h2><form id=lf><label>Email<input name=e type=email required autocomplete=username></label><label>Password<input name=p type=password required autocomplete=current-password></label><p style="margin-top:14px"><button class=btn>Sign in</button></p><p id=lm class=mu></p></form></div>`;
 if(!ADM)return`<div class=pg><h2>Not authorized</h2><p class=mu style="margin-bottom:14px">This account is not the site administrator.</p><button class=btn data-a=out>Sign out</button></div>`;
 const T=[["dash","Dashboard"],["cheats","Cheats"],["posts","Updates · Guides · FAQ"],["categories","Categories"],["messages","Messages"],["site","Site content"]],c=D.cheats,n=(a,f)=>a.filter(f).length;let b;
 if(AT==="dash")b=`<div class=st style="margin:20px 0">${[["Cheats",c.length],["Verified",n(c,ver)],["Unverified",n(c,x=>!ver(x))],["Drafts",n(c,x=>x.published===false)+n(D.posts,x=>x.published===false)],["Updates",n(D.posts,x=>x.type==="update")],["Guides",n(D.posts,x=>x.type==="guide")],["Categories",cats().length],["Messages",D.messages.length]].map(([l,v])=>`<div><b>${v}</b>${l}</div>`).join("")}</div>`;
 else if(AT==="site")b=`<p class=mu style="margin:16px 0">Hero title: ${h(D.site.heroTitle||"(default)")}</p><button class=btn data-a=add data-k=site>Edit site content</button>`;
 else b=`<p style="margin:14px 0">${AT!=="messages"?`<button class=btn data-a=add data-k=${AT}>+ Add new</button> `:""}${AT==="categories"&&!D.categories.length?`<button class="btn o" data-a=defs>Load default categories</button>`:""}</p>`+(D[AT].length?SO(AT).map(x=>row(AT,x)).join(""):`<p class=empty>Nothing here yet.</p>`);
 return`<div class=pg><div class=row style="border:0"><h2 style="flex:1;margin:0">Admin</h2><span class=mu>${h(U.email)}</span><button class="btn o" data-a=out>Sign out</button></div><div class=chips>${T.map(([k,l])=>`<button class="chip ${AT===k?"on":""}" data-a=tab data-k=${k}>${l}</button>`).join("")}</div>${b}</div>`};
function fld(n,t,o,d){const v=d[n];
 if(t==="text")return`<input name=${n} value="${h(v)}" ${n==="title"||n==="name"?"required":""}>`;
 if(t==="area")return`<textarea name=${n} rows=5>${h(v)}</textarea>`;
 if(t==="sel")return`<select name=${n}>${o.map(x=>`<option ${v===x?"selected":""}>${x}</option>`).join("")}</select>`;
 if(t==="cat")return`<select name=${n}>${cats().map(c=>`<option ${v===c[0]?"selected":""}>${h(c[0])}</option>`).join("")}</select>`;
 if(t==="plat")return`<span class=chips>${Object.entries(PL).map(([k,l])=>`<label><input type=checkbox name=plat value=${k} ${(v||[]).includes(k)?"checked":""}> ${l}</label>`).join("")}</span>`;
 if(t==="chk")return`<input type=checkbox name=${n} ${v===false?"":"checked"}>`;
 return`<input type=file id=fi accept="image/*"><img id=ip src="${h(IMG)}" alt="" style="display:${IMG?"block":"none"}"><button type=button class="btn o" data-a=noimg style="margin-top:8px">Remove image</button>`}
function openForm(k,id){const s=S[k],d=(k==="site"?D.site:D[k].find(x=>x.id===id))||{};EDIT={k,id:k==="site"?"site":id};IMG=d.image||"";
 $("#dlg").innerHTML=`<h2>${id||k==="site"?"Edit":"Add"} ${s.one}</h2><form id=ff>${s.f.map(([n,l,t,o])=>t==="plat"?`<div><span class=lb>${l}</span>${fld(n,t,o,d)}</div>`:`<label>${l}${fld(n,t,o,d)}</label>`).join("")}<div class=row style="border:0;margin-top:10px"><button class=btn>Save</button><button type=button class="btn o" data-a=x>Cancel</button></div></form>`;
 $("#dlg").showModal()}
async function save(){const s=S[EDIT.k],fd=new FormData($("#ff")),o={};
 for(const[n,,t]of s.f)o[n]=t==="plat"?fd.getAll("plat"):t==="chk"?fd.has(n):t==="img"?IMG:String(fd.get(n)||"").trim();
 if(!EDIT.id)o.createdAt=serverTimestamp();
 await setDoc(EDIT.k==="site"?doc(db,"settings","site"):EDIT.id?doc(db,EDIT.k,EDIT.id):doc(collection(db,EDIT.k)),o,{merge:true});
 $("#dlg").close()}
const rs=f=>new Promise(ok=>{const i=new Image,r=new FileReader;r.onload=()=>{i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};i.onerror=()=>ok("");i.src=r.result};r.readAsDataURL(f)});
function show(k,id){const x=(k==="cheats"?P("cheats"):D[k]).find(y=>y.id===id);if(!x)return;
 $("#dlg").innerHTML=(k==="cheats"?`${x.image?`<img class=im src="${h(x.image)}" alt="">`:""}${bd(x)}<h2 style="margin-top:10px">${h(x.title)}</h2><p class=wr>${h(x.desc)}</p>${x.code?`<h3 style="margin:16px 0 8px">Code / input</h3>${keys(x.code)?`<div class=ks>${keys(x.code)}</div>`:`<pre>${h(x.code)}</pre>`}<p><button class="btn o" data-a=copy data-id="${x.id}">Copy code</button></p>`:`<p class=mu>No code recorded yet.</p>`}${pls(x)}${ver(x)?"":`<p class=warn>Unverified: this entry has not been tested or confirmed yet. Treat it with caution.</p>`}`:`<span class="b p">${h(x.type)}</span><h2 style="margin-top:10px">${h(x.title)}</h2><p class=wr>${h(x.body)}</p>`)+`<p style="margin-top:18px"><button class="btn o" data-a=x>Close</button></p>`;
 $("#dlg").showModal();tx($("#dlg"))}
/* ---------- render + events ---------- */
function render(){
 const r=location.hash.slice(2).split("/")[0]||"home",a=$("#app"),ae=document.activeElement,id=ae&&ae.id,pos=ae&&ae.selectionStart;
 if((r==="admin"&&!U&&$("#lf"))||(r==="contact"&&$("#cf")))return;
 a.innerHTML=(R[r]||R.home)();
 document.querySelectorAll("nav .l").forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#/"+r));
 tx(a);tick();if(id&&$("#"+id)){const e=$("#"+id);e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}

document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,k=t.dataset.k,id=t.dataset.id;

  else if(a==="plat"){F.p=k;render()}

  else if(a==="del"){if(confirm("Delete this entry permanently?"))await deleteDoc(doc(db,k,id))}
  else if(a==="x")$("#dlg").close();
  else if(a==="out")await signOut(auth);
  else if(a==="defs")await Promise.all(DC.map(([name,icon])=>setDoc(doc(db,"categories",name.toLowerCase().replace(/\W+/g,"-")),{name,icon,createdAt:serverTimestamp()})));
  else if(a==="noimg"){IMG="";$("#ip").style.display="none"}
  else if(a==="copy"){await navigator.clipboard.writeText(P("cheats").find(y=>y.id===id).code);t.textContent="Copied ✔"}
 }catch(err){alert("Action failed: "+err.message)}});

 try{

  else if(f.id==="hf"){F.q=String(fd.get("q")||"");F.p=F.c="";location.hash="#/cheats"}
  else if(f.id==="ff")await save();
 }catch(err){const x=m();if(x)x.textContent="Error: "+(err.code||err.message);else alert("Error: "+(err.code||err.message))}});

document.documentElement.lang=LG;

render();txa();
