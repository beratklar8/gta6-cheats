<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA 6 Cheat Codes – PS5 / PS4</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07040f;--card:rgba(24,14,48,.72);--text:#f7f1ff;--muted:#a597c8;--pink:#ff2e93;--cyan:#19e3ff;--gold:#ffb23c;--line:rgba(255,255,255,.1);--chip:#241640;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff2fa;--card:rgba(255,255,255,.85);--text:#25103f;--muted:#6d5a8c;--line:rgba(60,20,90,.14);--chip:#2a1948;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.glow{position:fixed;inset:0;z-index:-2;background:radial-gradient(600px 400px at 85% -5%,rgba(255,46,147,.35),transparent 70%),radial-gradient(600px 450px at 0 15%,rgba(25,227,255,.28),transparent 70%),radial-gradient(700px 400px at 50% 110%,rgba(255,178,60,.22),transparent 70%)}
.grid{position:fixed;left:-50%;right:-50%;bottom:0;height:45vh;z-index:-1;opacity:.35;background-image:linear-gradient(var(--pink) 1px,transparent 1px),linear-gradient(90deg,var(--pink) 1px,transparent 1px);background-size:50px 50px;transform:perspective(300px) rotateX(60deg);transform-origin:bottom;animation:g 3s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
@keyframes g{to{background-position:0 50px}}
header{text-align:center;padding:44px 16px 10px}
.ps{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#0070d1,#00a6ff);color:#fff;font-weight:900;letter-spacing:2px;padding:8px 20px;border-radius:99px;font-size:1rem;box-shadow:0 0 24px rgba(0,140,255,.6)}
.ps i{font-style:normal;opacity:.7}
h1{margin:14px 0 0;font-size:clamp(4rem,22vw,9rem);line-height:.9;font-weight:900;letter-spacing:-4px;background:linear-gradient(180deg,#ffd36b,var(--pink) 55%,#7a2bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,46,147,.55))}
h2{margin:6px 0 0;font-size:clamp(1rem,5vw,1.6rem);letter-spacing:.5em;font-weight:800;color:var(--cyan);text-shadow:0 0 14px var(--cyan);padding-left:.5em}
.bar{max-width:920px;margin:26px auto 14px;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;backdrop-filter:blur(8px)}
.bar input:focus{outline:2px solid var(--cyan)}
.tab{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:800;backdrop-filter:blur(8px);transition:.2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(90deg,var(--pink),#8a3cff);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(255,46,147,.5)}
main{max-width:920px;margin:0 auto;padding:0 16px 40px;display:grid;gap:14px}
@media(min-width:720px){main{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 22px;position:relative;overflow:hidden;backdrop-filter:blur(10px);transition:.25s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--pink),var(--cyan))}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 34px rgba(255,46,147,.25);border-color:rgba(255,46,147,.5)}
.card.locked:before{background:linear-gradient(var(--cyan),#7a2bff)}
.card.locked{box-shadow:0 0 22px rgba(25,227,255,.15)}
.top{display:flex;justify-content:space-between;align-items:center}
.n{color:var(--pink);font-weight:900;font-size:.85rem;letter-spacing:2px}
.name{font-size:1.3rem;font-weight:900;margin:4px 0 12px;text-transform:uppercase;letter-spacing:.5px}
.combo{display:flex;flex-wrap:wrap;gap:7px}
.b{min-width:40px;height:40px;padding:0 9px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:1.1rem;background:var(--chip);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.b.t{color:#3cf08b;text-shadow:0 0 10px #3cf08b}.b.c{color:#ff4d5e;text-shadow:0 0 10px #ff4d5e}.b.x{color:#4da3ff;text-shadow:0 0 10px #4da3ff}.b.s{color:#ff7ad0;text-shadow:0 0 10px #ff7ad0}
.blur{filter:blur(8px);user-select:none;pointer-events:none}
.badge{font-size:.7rem;font-weight:900;letter-spacing:1px;padding:5px 10px;border-radius:99px;background:rgba(60,240,139,.15);color:#3cf08b}
.badge.new{background:rgba(25,227,255,.15);color:var(--cyan)}
.timer{margin-top:14px;display:flex;gap:8px;align-items:center;color:var(--cyan);font-weight:900;font-variant-numeric:tabular-nums}
.timer .u{background:rgba(25,227,255,.12);border:1px solid rgba(25,227,255,.35);border-radius:10px;padding:7px 8px;min-width:50px;text-align:center;font-size:1.1rem;text-shadow:0 0 10px var(--cyan)}
.timer small{display:block;font-size:.6rem;color:var(--muted);font-weight:700;text-shadow:none}
footer{text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;padding:0 16px 40px}
.empty{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}
@media(prefers-reduced-motion:reduce){.grid{animation:none}.card,.tab{transition:none}}
.cat{font-size:.7rem;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.desc{color:var(--muted);font-size:.9rem;margin:12px 0 0}
.adm{display:flex;gap:8px;margin-top:14px}
.sm{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-weight:700;font-size:.8rem}
.sm.d{color:#ff6b7a}
.add{background:linear-gradient(90deg,#19e3ff,#3c8bff);border:0;color:#04101f}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,12,.8);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 14px;font-size:1.3rem}
.sheet label{display:block;font-size:.75rem;font-weight:800;letter-spacing:1px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;font-family:inherit}
.pad{display:flex;flex-wrap:wrap;gap:6px}
.pad .b{cursor:pointer;font-family:inherit}
.seq{min-height:48px;padding:6px;border:1px dashed var(--line);border-radius:12px;margin-bottom:8px}
.two{display:flex;gap:8px}.two .tab{flex:1}
.err{color:#ff6b7a;font-size:.85rem;margin-top:10px;min-height:1em}
.foot{display:flex;gap:8px;margin-top:16px}.foot .tab{flex:1}
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<header>
<span class="ps">PS5 <i>/</i> PS4</span>
<h1>GTA 6</h1>
<h2>CHEAT CODES</h2>
<p id="sync" hidden></p>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Search a cheat…">
<button class="tab on" data-f="all">All</button>
<button class="tab" data-f="live">Live</button>
<button class="tab" data-f="soon">Coming soon</button>
</div>
<main id="list"></main>
<footer>Cheat Codes for GTA 6</footer>
<div class="modal" id="loginm" hidden><div class="sheet">
 <h3>Admin login</h3>
 <label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="Your admin email">
 <label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password">
 <div class="err" id="loginerr"></div>
 <div class="foot"><button class="tab" id="loginCancel" type="button">Cancel</button><button class="tab on" id="loginSubmit" type="button">Sign in</button></div>
 </div></div>
<div class="modal" id="m" hidden><div class="sheet">
<h3 id="mt">Add cheat</h3>
<label>Name</label><input id="fn" maxlength="40" placeholder="e.g. Infinite Nitro">
<label>Category</label><select id="fc"><option>Weapons</option><option>Money</option><option>Vehicles</option><option>Property</option><option>Player</option><option>Other</option></select>
<label>Controls</label><div class="seq combo" id="seq"></div>
<div class="pad" id="pad"></div>
<div class="two" style="margin-top:8px"><button class="sm" id="bk" type="button">⌫ Undo</button><button class="sm" id="cl" type="button">Clear</button></div>
<label>Status</label><div class="two"><button class="tab on" data-s="live" type="button">Live</button><button class="tab" data-s="soon" type="button">Coming soon</button></div>
<div id="dw" hidden><label>Unlocks on (your time)</label><input id="fd" type="datetime-local"></div>
<label>Description (optional)</label><textarea id="fx" rows="2" maxlength="140" placeholder="What does it do?"></textarea>
<div class="err" id="er"></div>
<div class="foot"><button class="tab" id="cx" type="button">Cancel</button><button class="tab on" id="sv" type="button">Save</button></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// 1) Paste your Firebase web-app config here (Firebase Console > Project settings > Your apps).
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  appId: "PASTE_APP_ID"
};

// 2) After creating your admin account in Firebase Authentication, paste its User UID here.
// This UID must match the UID in firestore.rules. Never use an email-only client-side check.
const ADMIN_UID = "PASTE_ADMIN_USER_UID";

var D = function(x){ return Date.parse(x); };
var BASE = [
 ["All Weapons","△ ○ X □ ↑ ↓ ← →",0,"Weapons"],
 ["Infinite Ammo","R1 R2 L1 L2 X □ ○ △",0,"Weapons"],
 ["Explosive Bullets","→ ← X R2 △ ○ ↓ ↑",0,"Weapons"],
 ["Fire Bullets","L1 R1 □ △ ← → X ○",0,"Weapons"],
 ["Golden Minigun","↑ ↑ R2 L2 ○ X □ △",0,"Weapons"],
 ["Perfect Aim","L2 R2 ← → □ X △ ○",0,"Weapons"],
 ["$1,000,000 Cash","↑ ↓ ← → X X ○ △",0,"Money"],
 ["$10,000,000 Cash","R1 R1 L2 X △ □ ↓ ↑",0,"Money"],
 ["Infinite Money","L1 L2 R1 R2 ↑ ↑ ○ X",D("2026-11-19T18:00:00Z"),"Money"],
 ["Free Houses","□ △ ○ X ← ← R1 L1",D("2026-11-21T18:00:00Z"),"Property"],
 ["Free Cars","→ → △ X R2 L2 ○ □",D("2026-11-24T18:00:00Z"),"Vehicles"],
 ["Full Health","○ X △ □ L1 R1 ↑ ↓",D("2026-11-27T18:00:00Z"),"Player"],
 ["God Mode","↑ ↑ ↓ ↓ ← → L2 R2",D("2026-12-01T18:00:00Z"),"Player"],
 ["Full Armor","R2 L2 ○ □ → ← X △",D("2026-12-05T18:00:00Z"),"Player"],
 ["Super Speed","X X △ R1 → → L1 ○",D("2026-12-10T18:00:00Z"),"Player"]
];
var KEYS=["△","○","X","□","↑","↓","←","→","L1","L2","L3","R1","R2","R3"];
var live={}, E=[], db=null, auth=null, owner=false, editing=null, seq=[], status="live", armed=null;
var $=function(i){return document.getElementById(i)};
var list=$("list"), q=$("q"), filter="all";
var cls={"△":"t","○":"c","X":"x","□":"s"};

function mk(id,o){return {id:id,name:o.name,code:o.code,unlockAt:o.unlockAt||0,category:o.category||"",desc:o.desc||""};}
function build(){
 E=[];
 BASE.forEach(function(b,i){
   var id="d"+(i+1), o=live[id];
   if(o&&o.hidden)return;
   E.push(mk(id,o&&o.name?o:{name:b[0],code:b[1],unlockAt:b[2],category:b[3]}));
 });
 Object.keys(live).filter(function(k){return !/^d([1-9]|1[0-5])$/.test(k)&&!live[k].hidden&&live[k].name;})
 .sort(function(x,y){return (live[x].order||0)-(live[y].order||0);})
 .forEach(function(k){E.push(mk(k,live[k]));});
}
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML;}
function chips(code,blur){return '<div class="combo'+(blur?' blur':'')+'">'+code.split(" ").map(function(k){return '<span class="b '+(cls[k]||"")+'">'+esc(k)+'</span>';}).join("")+'</div>';}
function render(){
 var now=Date.now(), t=q.value.toLowerCase(), h="";
 E.forEach(function(c,i){
   var lock=c.unlockAt&&c.unlockAt>now;
   if(t&&c.name.toLowerCase().indexOf(t)<0)return;
   if(filter==="live"&&lock)return;
   if(filter==="soon"&&!lock)return;
   h+='<div class="card'+(lock?' locked':'')+'"><div class="top"><span class="n">#'+String(i+1).padStart(2,"0")+(c.category?' · <span class="cat">'+esc(c.category)+'</span>':'')+'</span>'+
   (lock?'<span class="badge new">🔒 COMING SOON</span>':(c.unlockAt?'<span class="badge new">✨ NEW</span>':'<span class="badge">LIVE</span>'))+'</div>'+
   '<div class="name">'+esc(c.name)+'</div>'+
   (lock?chips(c.code,1)+'<div class="timer" data-t="'+c.unlockAt+'"></div>':chips(c.code))+
   (c.desc?'<p class="desc">'+esc(c.desc)+'</p>':'')+
   (owner?'<div class="adm"><button class="sm" data-a="e" data-id="'+c.id+'">✏️ Edit</button><button class="sm d" data-a="x" data-id="'+c.id+'">🗑 Delete</button></div>':'')+'</div>';
 });
 list.innerHTML=h||'<div class="empty">No cheats found 🕵️</div>';
 tick();
}
function tick(){
 var now=Date.now(), re=false;
 document.querySelectorAll(".timer").forEach(function(el){
   var d=Number(el.dataset.t)-now;
   if(d<=0){re=true;return;}
   var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
   function u(v,l){return '<span class="u">'+String(v).padStart(2,"0")+'<small>'+l+'</small></span>';}
   el.innerHTML='⏳ '+u(dd,"days")+u(hh,"hrs")+u(mm,"min")+u(ss,"sec");
 });
 if(re)render();
}
document.querySelectorAll(".bar .tab[data-f]").forEach(function(b){b.onclick=function(){
 document.querySelectorAll(".bar .tab[data-f]").forEach(function(x){x.classList.remove("on");});
 b.classList.add("on");filter=b.dataset.f;render();
};});
q.oninput=render;

// Admin sign-in. Firestore security rules also enforce the admin UID server-side.
$("loginb").onclick=function(){$("loginm").hidden=false;$("loginerr").textContent="";};
$("loginCancel").onclick=function(){$("loginm").hidden=true;};
$("logoutb").onclick=function(){auth.signOut();};
$("loginSubmit").onclick=function(){
 var email=$("loginEmail").value.trim(), password=$("loginPassword").value;
 $("loginSubmit").disabled=true;
 auth.signInWithEmailAndPassword(email,password).catch(function(err){
   $("loginerr").textContent="Sign-in failed. Check your email and password.";
 }).finally(function(){$("loginSubmit").disabled=false;});
};

function updateAdminUI(user){
 owner=!!(user&&user.uid===ADMIN_UID&&ADMIN_UID!=="PASTE_ADMIN_USER_UID");
 $("loginb").hidden=!!user;
 $("logoutb").hidden=!user;
 if(user&&!owner){auth.signOut();$("loginerr").textContent="This account is not the configured site owner.";return;}
 addBtn();render();
}
function drawSeq(){$("seq").innerHTML=seq.length?seq.map(function(k){return '<span class="b '+(cls[k]||"")+'">'+esc(k)+'</span>';}).join(""):'<span class="cat" style="padding:10px">Tap buttons below</span>';}
$("pad").innerHTML=KEYS.map(function(k){return '<button type="button" class="b '+(cls[k]||"")+'" data-k="'+k+'">'+k+'</button>';}).join("");
$("pad").onclick=function(e){var k=e.target.dataset.k;if(k&&seq.length<14){seq.push(k);drawSeq();}};
$("bk").onclick=function(){seq.pop();drawSeq();};
$("cl").onclick=function(){seq=[];drawSeq();};
function setStatus(s){status=s;document.querySelectorAll(".sheet .tab[data-s]").forEach(function(b){b.classList.toggle("on",b.dataset.s===s);});$("dw").hidden=s!=="soon";}
document.querySelectorAll(".sheet .tab[data-s]").forEach(function(b){b.onclick=function(){setStatus(b.dataset.s);};});
function pad2(n){return String(n).padStart(2,"0");}
function toLocal(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());}
function openForm(id){
 editing=id;var c=id&&E.filter(function(x){return x.id===id;})[0];
 $("mt").textContent=c?"Edit cheat":"Add cheat";
 $("fn").value=c?c.name:"";$("fc").value=c&&c.category?c.category:"Other";
 $("fx").value=c?c.desc:"";seq=c?c.code.split(" "):[];drawSeq();
 var soon=c&&c.unlockAt>Date.now();setStatus(soon?"soon":"live");
 $("fd").value=soon?toLocal(c.unlockAt):toLocal(Date.now()+86400000);
 $("er").textContent="";$("m").hidden=false;
}
$("cx").onclick=function(){$("m").hidden=true;};
$("sv").onclick=function(){
 if(!owner||!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){$("er").textContent="Admin sign-in required.";return;}
 var name=$("fn").value.trim();
 if(!name){$("er").textContent="Give it a name.";return;}
 if(!seq.length){$("er").textContent="Add the controls.";return;}
 var at=0;
 if(status==="soon"){at=Date.parse($("fd").value);if(!at||at<=Date.now()){$("er").textContent="Pick a date in the future.";return;}}
 var old=editing&&live[editing];
 var data={name:name,code:seq.join(" "),unlockAt:at,category:$("fc").value,desc:$("fx").value.trim(),order:(old&&old.order)||Date.now()};
 var ref=editing?db.collection("codes").doc(editing):db.collection("codes").doc();
 $("sv").disabled=true;
 ref.set(data).then(function(){$("m").hidden=true;}).catch(function(err){$("er").textContent="Could not save. Check Firebase setup and Firestore rules.";}).finally(function(){$("sv").disabled=false;});
};
list.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b||!db||!owner)return;
 var id=b.dataset.id;
 if(b.dataset.a==="e"){openForm(id);return;}
 if(armed!==id){armed=id;b.textContent="Sure? Tap again";setTimeout(function(){armed=null;if(b.isConnected)b.textContent="🗑 Delete";},3000);return;}
 armed=null;
 var ref=db.collection("codes").doc(id);
 (/^d([1-9]|1[0-5])$/.test(id)?ref.set({hidden:true}):ref.delete()).catch(function(){});
});
function addBtn(){
 if(!owner||$("addb"))return;
 var b=document.createElement("button");b.id="addb";b.className="tab add";b.textContent="＋ Add cheat";
 b.onclick=function(){openForm(null);};
 document.querySelector(".bar").appendChild(b);
}

// Start Firebase only after the config placeholders have been replaced.
var configured = firebaseConfig.apiKey!=="PASTE_API_KEY" &&
                 firebaseConfig.projectId!=="PASTE_PROJECT_ID" &&
                 ADMIN_UID!=="PASTE_ADMIN_USER_UID";
if(configured){
 try{
   firebase.initializeApp(firebaseConfig);
   auth=firebase.auth();db=firebase.firestore();
   auth.onAuthStateChanged(updateAdminUI);
   db.collection("codes").onSnapshot(function(snap){
     live={};snap.docs.forEach(function(x){if(x.exists)live[x.id]=x.data();});
     build();render();
   },function(){});
 }catch(err){console.error("Firebase setup error",err);}
}else{
 build();render();
 $("loginb").onclick=function(){alert("Firebase is not configured yet. Follow README_SETUP.txt first.");};
}
setInterval(tick,1000);
</script>
</body>
</html>
